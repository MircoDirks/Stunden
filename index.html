  <style>
    :root {
      --bg: #0b1120;
      --card: #131c31;
      --card-2: #1a2540;
      --border: #263554;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(84px + env(safe-area-inset-bottom));
      line-height: 1.45;
    }

    button, input, select {
      font-family: inherit;
      cursor: pointer;
    }

    input, select {
      cursor: text;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(11, 17, 32, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: #fff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .brand-sub {
      font-size: 11px;
      color: #38bdf8;
      font-weight: 600;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 14px 14px 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .timer-display {
      text-align: center;
      padding: 10px 0 14px;
    }

    .timer-clock {
      font-size: 42px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
      color: #fff;
    }

    .timer-status {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--card-2);
      color: var(--muted);
    }

    .timer-status.active {
      background: rgba(16, 185, 129, 0.16);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .timer-status.paused {
      background: rgba(245, 158, 11, 0.16);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 14px 14px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.08s ease, opacity 0.15s ease;
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.38; cursor: not-allowed; }

    .btn-green { background: var(--green); color: #052e16; }
    .btn-amber { background: var(--amber); color: #271500; }
    .btn-red { background: var(--red); color: #fff; }
    .btn-blue { background: var(--primary); color: #fff; }
    .btn-ghost {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-full { width: 100%; }
    .btn-sm { padding: 9px 12px; font-size: 13px; border-radius: 10px; }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .form-group { margin-bottom: 10px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    input[type="time"],
    input[type="month"],
    select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    input:focus, select:focus { border-color: var(--primary); }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .kpi-box {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .kpi-label { font-size: 11px; color: var(--muted); font-weight: 600; }
    .kpi-val { font-size: 20px; font-weight: 800; margin-top: 3px; font-variant-numeric: tabular-nums; }
    .kpi-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .text-green { color: #34d399; }
    .text-amber { color: #fbbf24; }
    .text-red { color: #f87171; }
    .text-blue { color: #60a5fa; }

    .entry-item {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .entry-date { font-weight: 700; font-size: 14px; }
    .entry-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .entry-hours { text-align: right; flex-shrink: 0; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
    }

    .badge-plus { background: rgba(16, 185, 129, 0.16); color: #34d399; }
    .badge-neutral { background: rgba(148, 163, 184, 0.16); color: #cbd5e1; }
    .badge-spesen { background: rgba(59, 130, 246, 0.18); color: #93c5fd; margin-left: 4px; }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: rgba(19, 28, 49, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding-bottom: env(safe-area-inset-bottom);
    }

      border: none;
      color
